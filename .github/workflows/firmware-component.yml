# SPDX-License-Identifier: MIT
# Reusable component CI for firmware and rootfs repos.
# Called from each source repo's .github/workflows/opentina-firmware.yml.
# One job per build.sh invocation (board × tee × profile).
# Rootfs jobs also pack sdcard.img and upload it as an artifact.
name: OpenTina component

on:
  workflow_call:
    secrets:
      token:
        required: false
    inputs:
      project:
        description: Manifest project name; default is the caller repository name
        type: string
        required: false
        default: ""
      build_repo:
        type: string
        default: opentina-org/build
      build_ref:
        description: Build-repo ref for recipes and fragments
        type: string
        default: tina-dev

concurrency:
  group: component-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout build recipes
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.build_repo }}
          ref: ${{ inputs.build_ref }}
          path: build
          token: ${{ secrets.token || github.token }}

      - name: List builds
        id: gen
        env:
          PROJECT_IN: ${{ inputs.project }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          name="${PROJECT_IN:-${REPO##*/}}"
          json="$(build/scripts/ci-firmware-build.sh matrix "$name")"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"
          echo "$json" | python3 -m json.tool

  build:
    name: ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      DEBIAN_FRONTEND: noninteractive
      OPENTINA_GH_TOKEN: ${{ secrets.token }}
    steps:
      - name: Checkout PR tree
        uses: actions/checkout@v4
        with:
          path: firmware

      - name: Checkout build recipes
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.build_repo }}
          ref: ${{ inputs.build_ref }}
          path: build
          token: ${{ secrets.token || github.token }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -hT / /mnt || df -hT /

      - name: Reclaim extra disk (Yocto)
        if: matrix.yocto == 'true'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/swift /usr/local/share/powershell \
            /usr/local/.ghcup /opt/az /usr/share/miniconda || true
          if [ -f /mnt/swapfile ]; then
            sudo swapoff /mnt/swapfile || true
            sudo rm -f /mnt/swapfile
          fi
          if [ ! -e /swapfile ]; then
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          mnt_kb="$(df --output=avail /mnt 2>/dev/null | tail -1 | tr -d ' ' || true)"
          if [ -n "${mnt_kb:-}" ] && [ "$mnt_kb" -gt $((10 * 1024 * 1024)) ]; then
            sudo mkdir -p /mnt/yocto
            sudo chown "$(id -un):$(id -gn)" /mnt/yocto
            echo "OPENTINA_YOCTO_DIR=/mnt/yocto" >> "$GITHUB_ENV"
            echo "Using /mnt for Yocto workdir (${mnt_kb} KiB free)"
          else
            echo "/mnt is small or missing; Yocto stays on the workspace disk"
          fi
          df -hT / /mnt || df -hT /

      - name: Allow unprivileged user namespaces (Yocto)
        if: matrix.yocto == 'true'
        run: |
          echo 'kernel.apparmor_restrict_unprivileged_userns=0' | sudo tee /etc/sysctl.d/99-bitbake-userns.conf
          sudo sysctl -p /etc/sysctl.d/99-bitbake-userns.conf

      - name: Install host packages
        run: build/scripts/ci-install-deps.sh

      - uses: hendrikmuhs/ccache-action@v1.2
        if: matrix.ccache == 'true'
        with:
          key: component-${{ matrix.project }}-${{ matrix.rootfs }}-${{ matrix.profile || 'default' }}-${{ matrix.tee }}-${{ matrix.board }}-${{ runner.os }}
          restore-keys: |
            component-${{ matrix.project }}-${{ matrix.rootfs }}-${{ matrix.profile || 'default' }}-
          max-size: 1G

      - name: Build ${{ matrix.label }}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          FIRMWARE_SRC: ${{ github.workspace }}/firmware
          OPENTINA_BUILD_ROOT: ${{ github.workspace }}/build
          OPENTINA_CI_BOARD: ${{ matrix.board }}
          OPENTINA_CI_ROOTFS: ${{ matrix.rootfs }}
          OPENTINA_CI_TEE: ${{ matrix.tee }}
          OPENTINA_CI_PROFILE: ${{ matrix.profile }}
          OPENTINA_CI_COMPONENTS: ${{ matrix.components }}
          OPENTINA_CI_PACK_IMAGE: ${{ matrix.pack_image }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.ccache }}" = true ]; then
            export PATH="/usr/lib/ccache:${PATH}"
          fi
          exec "$OPENTINA_BUILD_ROOT/scripts/ci-firmware-build.sh" run "${{ matrix.project }}"

      - name: Stage sdcard image
        if: matrix.pack_image == 'true'
        run: |
          set -euo pipefail
          src="build/output/${{ matrix.board }}"
          test -f "$src/sdcard.img"
          printf '%s\n' "${{ matrix.tee }}" > "$src/OPTEE.txt"
          (
            cd "$src"
            echo "tee=${{ matrix.tee }}"
            echo "profile=${{ matrix.profile }}"
            sha256sum sdcard.img
            for f in u-boot.fex Image.gz rootfs.ext2 tee.bin *.dtb OPTEE.txt; do
              [ -e "$f" ] || continue
              sha256sum "$f"
            done
          ) | tee "$src/SHA256SUMS"
          dst="${{ runner.temp }}/image-artifact"
          mkdir -p "$dst"
          cp -a "$src/sdcard.img" "$src/SHA256SUMS" "$src/OPTEE.txt" "$dst/"
          if [ -f "$src/SOURCE_REVS.txt" ]; then
            cp -a "$src/SOURCE_REVS.txt" "$dst/"
          fi
          cp -a "$src/u-boot.fex" "$src/Image.gz" "$dst/"
          cp -a "$src"/*.dtb "$dst/"
          if [ "${{ matrix.tee }}" = optee ]; then
            cp -a "$src/tee.bin" "$dst/"
          fi
          ls -lh "$dst/sdcard.img"

      - uses: actions/upload-artifact@v4
        if: matrix.pack_image == 'true'
        with:
          name: ${{ matrix.board }}-${{ matrix.rootfs }}${{ matrix.profile != '' && format('-{0}', matrix.profile) || '' }}-${{ matrix.tee }}
          path: ${{ runner.temp }}/image-artifact/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
