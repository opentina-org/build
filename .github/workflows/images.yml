# SPDX-License-Identifier: MIT
# PR: 7-job subset (demo × 5 rootfs/optee + demo buildroot/no-optee + a7a buildroot/optee).
# Tag / workflow_dispatch(full): complete board × rootfs × TEE matrix.
# Tag push: GitHub Release. Incomplete matrix is published as prerelease with a missing list.
name: Images

on:
  pull_request:
    branches:
      - tina-dev
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - .gitignore
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      matrix:
        description: Image matrix (pr = 7-job PR subset)
        type: choice
        options:
          - pr
          - daily
          - full
        default: full
  schedule:
    # Daily baseline: board x {buildroot, ubuntu, debian} x tee.
    # Runs on the default branch only; releases stay tag-only.
    - cron: "17 19 * * *"

concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        env:
          EVENT_NAME: ${{ github.event_name }}
          MATRIX_SCOPE: ${{ github.event.inputs.matrix || '' }}
        run: |
          python3 <<'PY'
          import json, os

          boards = ["demo_aiot_a733_v3", "radxa_a7a"]
          full_rootfs = ["buildroot", "ubuntu", "debian", "openwrt", "yocto"]
          tees = ["optee", "no-optee"]
          timeouts = {
              "buildroot": 180,
              "ubuntu": 120,
              "debian": 120,
              "openwrt": 240,
              "yocto": 360,
          }
          flags = {"optee": "--optee", "no-optee": "--no-optee"}

          event = os.environ.get("EVENT_NAME", "")
          scope = os.environ.get("MATRIX_SCOPE", "").strip()

          def rows(pairs):
              return [
                  {
                      "board": board,
                      "rootfs": fs,
                      "tee": tee,
                      "tee_flag": flags[tee],
                      "timeout": timeouts[fs],
                  }
                  for board, fs, tee in pairs
              ]

          # Daily: board × {buildroot, ubuntu, debian} × tee. OpenWrt and Yocto
          # join once their build times are comfortable in a nightly window.
          daily_pairs = [
              (board, fs, tee)
              for board in boards
              for fs in ["buildroot", "ubuntu", "debian"]
              for tee in tees
          ]

          # PR: demo × all rootfs/optee, plus demo buildroot/no-optee and a7a buildroot/optee.
          pr_pairs = [
              ("demo_aiot_a733_v3", "buildroot", "optee"),
              ("demo_aiot_a733_v3", "yocto", "optee"),
              ("demo_aiot_a733_v3", "ubuntu", "optee"),
              ("demo_aiot_a733_v3", "debian", "optee"),
              ("demo_aiot_a733_v3", "openwrt", "optee"),
              ("demo_aiot_a733_v3", "buildroot", "no-optee"),
              ("radxa_a7a", "buildroot", "optee"),
          ]
          full_pairs = [
              (board, fs, tee)
              for board in boards
              for fs in full_rootfs
              for tee in tees
          ]

          if scope == "full":
              include = rows(full_pairs)
              label = "full"
          elif scope == "daily" or event == "schedule":
              include = rows(daily_pairs)
              label = "daily"
          elif scope == "pr" or event == "pull_request":
              include = rows(pr_pairs)
              label = "pr"
          else:
              include = rows(full_pairs)
              label = "full"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("matrix=" + json.dumps({"include": include}) + "\n")
          print("scope:", label, "jobs:", len(include))
          print("matrix include:", json.dumps(include, indent=2))
          PY

  images:
    name: ${{ matrix.board }} / ${{ matrix.rootfs }} / ${{ matrix.tee }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      DEBIAN_FRONTEND: noninteractive
      # GitHub cache cap is 10 GB/repo (LRU). 20 jobs × 2G evict each other.
      # Only the long compile jobs: buildroot / openwrt / yocto, 1G each.
      ENABLE_CCACHE: ${{ matrix.rootfs == 'buildroot' || matrix.rootfs == 'openwrt' || matrix.rootfs == 'yocto' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -hT / /mnt || df -hT /

      - name: Reclaim extra disk (Yocto)
        if: matrix.rootfs == 'yocto'
        run: |
          set -euo pipefail
          # Extra runtimes beyond the common cleanup (~10 GB+).
          sudo rm -rf /usr/share/swift /usr/local/share/powershell \
            /usr/local/.ghcup /opt/az /usr/share/miniconda || true
          # Runners often keep a several-GB swapfile on /mnt. Drop it so
          # bitbake can use that disk; recreate a modest swap on /.
          if [ -f /mnt/swapfile ]; then
            sudo swapoff /mnt/swapfile || true
            sudo rm -f /mnt/swapfile
          fi
          if [ ! -e /swapfile ]; then
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          mnt_kb="$(df --output=avail /mnt 2>/dev/null | tail -1 | tr -d ' ' || true)"
          if [ -n "${mnt_kb:-}" ] && [ "$mnt_kb" -gt $((10 * 1024 * 1024)) ]; then
            sudo mkdir -p /mnt/yocto
            sudo chown "$(id -un):$(id -gn)" /mnt/yocto
            echo "OPENTINA_YOCTO_DIR=/mnt/yocto" >> "$GITHUB_ENV"
            echo "Using /mnt for Yocto workdir (${mnt_kb} KiB free)"
          else
            echo "/mnt is small or missing; Yocto stays on the workspace disk"
            echo "HMI/qt profile (mesa + llvm) likely needs a larger runner"
          fi
          df -hT / /mnt || df -hT /
          swapon --show || true

      - uses: actions/checkout@v4

      - name: GitHub clone credentials
        env:
          OPENTINA_GH_TOKEN: ${{ secrets.OPENTINA_GH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          token="${OPENTINA_GH_TOKEN:-$GITHUB_TOKEN}"
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"

      - name: Install host packages
        run: ./scripts/ci-install-deps.sh

      - uses: hendrikmuhs/ccache-action@v1.2
        if: env.ENABLE_CCACHE == 'true'
        with:
          key: ${{ matrix.board }}-${{ matrix.rootfs }}-${{ matrix.tee }}-${{ runner.os }}
          restore-keys: |
            ${{ matrix.board }}-${{ matrix.rootfs }}-${{ matrix.tee }}-${{ runner.os }}
            ${{ matrix.board }}-${{ matrix.rootfs }}-${{ runner.os }}
          max-size: 1G

      - name: Allow unprivileged user namespaces (Yocto)
        if: matrix.rootfs == 'yocto'
        run: |
          echo 'kernel.apparmor_restrict_unprivileged_userns=0' | sudo tee /etc/sysctl.d/99-bitbake-userns.conf
          sudo sysctl -p /etc/sysctl.d/99-bitbake-userns.conf

      - name: Clone sources
        run: ./build.sh init

      - name: Build ${{ matrix.board }} ${{ matrix.rootfs }} ${{ matrix.tee }}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          if [ "${ENABLE_CCACHE}" = true ]; then
            export PATH="/usr/lib/ccache:${PATH}"
          fi
          ./build.sh ${{ matrix.tee_flag }} "${{ matrix.board }}" "${{ matrix.rootfs }}" build
          printf '%s\n' "${{ matrix.tee }}" > "output/${{ matrix.board }}/OPTEE.txt"

      - name: Record source revisions
        run: ./scripts/source-revs.sh | tee "output/${{ matrix.board }}/SOURCE_REVS.txt"

      - name: Checksums
        run: |
          out="output/${{ matrix.board }}"
          test -f "$out/sdcard.img"
          (
            cd "$out"
            echo "tee=${{ matrix.tee }}"
            sha256sum sdcard.img
            for f in u-boot.fex Image.gz rootfs.ext2 tee.bin *.dtb OPTEE.txt; do
              [ -e "$f" ] || continue
              sha256sum "$f"
            done
          ) | tee "$out/SHA256SUMS"
          ls -lh "$out/sdcard.img"

      - name: Stage artifact
        run: |
          src="output/${{ matrix.board }}"
          dst="${{ runner.temp }}/image-artifact"
          mkdir -p "$dst"
          cp -a "$src/sdcard.img" "$src/SHA256SUMS" "$src/OPTEE.txt" \
            "$src/SOURCE_REVS.txt" "$src/u-boot.fex" "$src/Image.gz" "$dst/"
          cp -a "$src"/*.dtb "$dst/"
          if [ "${{ matrix.tee }}" = optee ]; then
            cp -a "$src/tee.bin" "$dst/"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-${{ matrix.rootfs }}-${{ matrix.tee }}
          path: ${{ runner.temp }}/image-artifact/
          if-no-files-found: error
          compression-level: 6
          # Nightlies only need to outlive a day or two; keep them from piling up.
          retention-days: ${{ github.event_name == 'schedule' && 7 || 14 }}

  release:
    name: GitHub Release ${{ github.ref_name }}
    needs: [prepare, images]
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack release assets
        id: pack
        env:
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            img="$dir/sdcard.img"
            [ -f "$img" ] || continue
            echo "xz $name sdcard.img"
            xz -T0 -c "$img" > "release/${name}-sdcard.img.xz"
          done
          [ -n "$(ls -A release 2>/dev/null)" ] || {
            echo "no image artifacts to publish" >&2
            exit 1
          }
          (cd release && sha256sum *-sdcard.img.xz > SHA256SUMS)
          ls -lh release

          python3 <<'PY'
          import json, os
          from collections import OrderedDict
          from pathlib import Path

          rows = json.loads(os.environ["MATRIX_JSON"])["include"]
          expected = [f"{row['board']}-{row['rootfs']}-{row['tee']}" for row in rows]
          found = {
              p.name.removesuffix("-sdcard.img.xz")
              for p in Path("release").glob("*-sdcard.img.xz")
          }
          missing_rows = [
              row for row, name in zip(rows, expected) if name not in found
          ]
          published_rows = [
              row for row, name in zip(rows, expected) if name in found
          ]
          extras = sorted(found.difference(expected))
          tag = os.environ.get("GITHUB_REF_NAME", "")
          images_result = os.environ.get("IMAGES_RESULT", "")

          def combo(row: dict) -> str:
              return f"`{row['board']}` / {row['rootfs']} / {row['tee']}"

          def parse_revs(text: str):
              out = []
              for line in text.splitlines():
                  if not line.strip() or line.startswith("#"):
                      continue
                  parts = line.split("\t")
                  if len(parts) < 5:
                      continue
                  out.append(
                      {
                          "path": parts[0],
                          "commit": parts[1],
                          "abbrev": parts[2],
                          "ref": parts[3],
                          "url": parts[4],
                      }
                  )
              return out

          def github_urls(url: str, sha: str):
              raw = (url or "").strip()
              if raw.startswith("git@github.com:"):
                  path = raw[len("git@github.com:") :]
              elif "github.com/" in raw:
                  path = raw.split("github.com/", 1)[1]
              else:
                  return None, None
              path = path.removesuffix(".git").strip("/")
              repo_url = f"https://github.com/{path}"
              return repo_url, f"{repo_url}/commit/{sha}"

          by_path = OrderedDict()
          for revs_file in sorted(Path("artifacts").glob("*/SOURCE_REVS.txt")):
              job = revs_file.parent.name
              for rec in parse_revs(revs_file.read_text(encoding="utf-8")):
                  slot = by_path.setdefault(rec["path"], OrderedDict())
                  entry = slot.setdefault(
                      rec["commit"],
                      {
                          "abbrev": rec["abbrev"],
                          "ref": rec["ref"],
                          "url": rec["url"],
                          "jobs": [],
                      },
                  )
                  entry["jobs"].append(job)

          merged_lines = [
              "# Merged source revisions from image jobs.",
              "# path	commit	abbrev	ref	url",
          ]
          mismatched = []
          source_rows = []
          for path, commits in by_path.items():
              if len(commits) > 1:
                  mismatched.append(path)
              for commit, meta in commits.items():
                  merged_lines.append(
                      "\t".join(
                          [path, commit, meta["abbrev"], meta["ref"], meta["url"]]
                      )
                  )
                  repo_url, commit_url = github_urls(meta["url"], commit)
                  tree = f"[`{path}`]({repo_url})" if repo_url else f"`{path}`"
                  sha = (
                      f"[`{meta['abbrev']}`]({commit_url})"
                      if commit_url
                      else f"`{meta['abbrev']}`"
                  )
                  source_rows.append((tree, meta["ref"], sha, len(commits) > 1))
          if by_path:
              Path("release/SOURCE_REVS.txt").write_text(
                  "\n".join(merged_lines) + "\n", encoding="utf-8"
              )

          lines = [
              f"OpenTina images for tag `{tag}`.",
              "",
          ]
          if missing_rows:
              lines += [
                  f"> **Incomplete matrix** — {len(missing_rows)} of {len(rows)} combinations are missing "
                  f"(images job result: `{images_result}`). This release is marked as a prerelease.",
                  "",
              ]
          else:
              lines += [
                  f"Full matrix ({len(rows)} combinations) published.",
                  "",
              ]
          lines += ["### Published", ""]
          lines += [f"- {combo(row)}" for row in published_rows]
          lines += [f"- `{name}`" for name in extras]
          if not published_rows and not extras:
              lines.append("- _(none)_")
          if missing_rows:
              lines += ["", "### Missing (job failed or produced no image)", ""]
              lines += [f"- {combo(row)}" for row in missing_rows]
          if source_rows:
              lines += [
                  "",
                  "### Source revisions",
                  "",
                  "Git commits used by the image jobs (`./build.sh init` / the default source manifest).",
                  "",
              ]
              if mismatched:
                  names = ", ".join(f"`{p}`" for p in mismatched)
                  lines += [
                      f"> **Mismatched clones:** {names} were not the same commit in every image job. "
                      "See `SOURCE_REVS.txt`.",
                      "",
                  ]
              lines += [
                  "| Tree | Ref | Commit |",
                  "| --- | --- | --- |",
              ]
              for tree, ref, sha, _conflict in source_rows:
                  lines.append(f"| {tree} | `{ref}` | {sha} |")
              lines += ["", "Full listing: `SOURCE_REVS.txt`.", ""]
          lines += [
              "",
              "Each `*-sdcard.img.xz` is one board × rootfs × OP-TEE image. "
              "Decompress with `xz -d` then `dd` to the SD card.",
              "",
          ]
          Path("release-notes.md").write_text("\n".join(lines), encoding="utf-8")
          print(Path("release-notes.md").read_text(encoding="utf-8"))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"incomplete={'true' if missing_rows else 'false'}\n")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          extra=()
          if [ "${{ steps.pack.outputs.incomplete }}" = true ]; then
            extra+=(--prerelease)
          else
            extra+=(--latest)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md "${extra[@]}"
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* \
              --title "$tag" \
              --notes-file release-notes.md \
              "${extra[@]}"
          fi
